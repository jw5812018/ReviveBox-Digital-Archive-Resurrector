# Render Blueprint: the EchoShelf feed service (API only).
# The client stays on GitHub Pages and calls this service for live feed refresh.
# Only the server and shared code are installed; the client is not built here,
# so the service runs API-only (no dist/ folder).
services:
  - type: web
    name: echoshelf-feeds
    runtime: node
    plan: free
    region: singapore
    rootDir: 2026kirowen
    buildCommand: npm ci --omit=dev --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Paths are relative to the repository root. Client-only or docs-only
    # commits do not redeploy the service.
    buildFilter:
      paths:
        - 2026kirowen/src/server/**
        - 2026kirowen/src/shared/**
        - 2026kirowen/package.json
        - 2026kirowen/package-lock.json
        - 2026kirowen/tsconfig.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Exact origin of the GitHub Pages site (no path, no trailing slash).
      - key: ALLOWED_ORIGINS
        value: https://jw5812018.github.io
      # Render sits behind its own proxy layer. 1 is the safe choice: it can
      # only make buckets coarser, never let a client pick its own address.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: FEED_RATE_LIMIT
        value: "20"